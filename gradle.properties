org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# Gould 0.13 dev-speed: reuse task outputs and configuration across builds.
# Mandatory RELEASE verification still pins --no-daemon --max-workers=1 for reproducibility.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
android.useAndroidX=true
# AGP 9 built-in Kotlin embeds KGP 2.2.10; use the explicitly pinned KGP 2.4.21 instead.
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
