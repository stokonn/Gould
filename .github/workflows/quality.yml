name: Gould quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up required Android SDK packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build, JVM tests, instrumentation compilation and lint
        run: ./gradlew clean assembleDebug testDebugUnitTest assembleDebugAndroidTest lintDebug --no-daemon --max-workers=1
      - name: Host data and policy checks
        run: |
          python3 scripts/check_migrations.py
          python3 scripts/check_backup_fixtures.py
          python3 docs/planning/goldberg-0.11/stage-3b/check_fixtures.py
          python3 scripts/check_localization.py
          python3 scripts/check_history_paging.py
          python3 scripts/check_ui_literals.py
          python3 scripts/check_agent_policy.py
          python3 scripts/check_admin_retirement.py
          python3 scripts/check_publication_workflows.py
          python3 scripts/check_curated_catalogue.py
          python3 -m unittest discover -s scripts -p 'test_publication_workflows.py'
          python3 -m unittest discover -s scripts -p 'test_upgrade_table_expectations.py'
          python3 -m unittest discover -s scripts -p 'test_emulator_network_assertion.py'
          git diff --exit-code -- app/schemas
# This workflow never publishes APKs signed with a runner-generated key.
# Owner physical-device UI/upgrade acceptance and release signing/publication follow AGENTS.md; emulator CI is optional.
