name: Gould iOS cloud build

on:
  pull_request:
    branches: [main]
    paths:
      - "iosApp/**"
      - "activity-domain/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/ios-cloud-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-cloud-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS app (unsigned)
    runs-on: macos-15-xlarge
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java for Kotlin Multiplatform
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Show Xcode toolchain
        run: |
          uname -m
          xcodebuild -version
          xcodebuild -list -project iosApp/iosApp.xcodeproj

      - name: Build iOS Simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme Gould \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/Gould-Simulator-DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/ios-simulator-build.log"

      - name: Run iOS persistence and interoperability tests
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme Gould \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -derivedDataPath "$RUNNER_TEMP/Gould-Simulator-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/ios-tests.log"

      - name: Archive iOS device app without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme Gould \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Gould.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee "$RUNNER_TEMP/ios-device-archive.log"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/Gould.xcarchive/Products/Applications/Gould.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/Gould.app"
          (
            cd "$RUNNER_TEMP/ipa"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/Gould-unsigned.ipa" Payload
          )
          shasum -a 256 "$GITHUB_WORKSPACE/Gould-unsigned.ipa"

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Gould-unsigned-IPA
          path: Gould-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Gould-iOS-build-logs
          path: |
            ${{ runner.temp }}/ios-simulator-build.log
            ${{ runner.temp }}/ios-tests.log
            ${{ runner.temp }}/ios-device-archive.log
          if-no-files-found: warn
          retention-days: 7
