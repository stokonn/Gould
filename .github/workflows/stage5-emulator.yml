name: Gould Android emulator verification
# Tasks 5.10 (instrumentation) and 5.11 (emulator acceptance subset) on a
# GitHub-hosted Linux runner with KVM acceleration (hardware-accelerated
# Android virtualization, GitHub Changelog 2024-04-02).
#
# Safety / policy:
#   - workflow_dispatch ONLY: no automatic runs; widening the triggers is an
#     explicit owner decision (AGENTS.md: ask before significant CI changes).
#   - contents: read only; credentials are not persisted; production signing
#     credentials never enter CI; nothing is published, merged or tagged.
#     Debug APKs ARE signed — with the runner's temporary debug keystore only
#     (a throwaway key generated inside the job; CI output is never a
#     release artifact).
#   - Default full verification runs the complete
#     connected suite via `connectedDebugAndroidTest` (all 42 androidTest
#     classes; no runner-argument filters, no @Ignore, no excluded classes).
#     Acceptance-only execution requires an exact Android source inventory match
#     to retained full native evidence; it never claims a new instrumentation run.
#   - Infrastructure-only retry (both jobs): the emulator step may run a
#     second time, and only when ZERO test evidence exists (no instrumentation
#     result XML or only XML reporting tests="0" / the acceptance script never
#     reached system-service readiness). This absorbs the known upstream boot
#     race - the pinned android-emulator-runner v2.38.0 runs `input keyevent 82`
#     immediately after sys.boot_completed without waiting for system services
#     (upstream ReactiveCircus/android-emulator-runner#432 and #489; fix PR #495
#     is not in v2.38.0; observed in run 43246507990 job 5.10) - and the
#     system-service-not-yet-published install abort (StorageManager NPE /
#     Broken pipe, observed in run 43243176345 job 5.10 and locally on API 37)
#     without ever retrying a run that produced results. A genuine test/harness
#     failure fails both the first attempt and the final outcome gate.
#   - Every adb use inside the scripts resolves and exports a single explicit
#     `emulator-NNNN` serial and verifies `ro.kernel.qemu=1`; a physical device
#     can never be selected (multiple attached devices abort the run).
#   - Actions are pinned to full commit SHAs (repo convention); every pin was
#     re-verified against its release tag before this workflow version.
#   - Each job records and asserts `git rev-parse HEAD == GITHUB_SHA` into the
#     uploaded evidence, so results are bound to the exact dispatched commit.
#   - Dispatch the reviewed current maintenance/development commit after it is
#     available remotely. The historical Stage 5 branch is not the current
#     development baseline; all helper scripts now live in the primary checkout.
#
# Signing resolution (verified 2026-10-20, AGENTS.md publication gates):
#   - The trusted 0.10.1 release APK is signed with the trusted certificate
#     SHA-256 53eface4978f03dd7f0d7f1eb97ab94eed97055fe04a2a0fab9a7f280141d59e
#     (apksigner-verified). A GitHub runner auto-generates a throwaway debug
#     keystore, so a CI-built debug candidate can never be installed over the
#     release-signed baseline in place (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
#     Production signing credentials are NEVER uploaded to CI.
#   - Therefore the in-place upgrade test uses a debug rebuild of the exact
#     v0.10.1 tag built in the same job - same runner debug keystore as the
#     candidate - so signatures match by construction and the genuine data
#     migration path (schema 8 -> 12) is exercised end to end.
#   - Release-signature compatibility of the future 0.12 release APK remains a
#     separate publication gate: this job asserts the trusted 0.10.1 release
#     APK really carries the trusted certificate, and the release gate asserts
#     the new release APK carries the same certificate (transitive proof).
#
# Coverage honesty (task 5.11 matrix):
#   - Covered here (state-asserted, not just logged): seeded in-place upgrade
#     from a v0.10.1 debug rebuild (script-asserted table/schema equality,
#     PRAGMA integrity/foreign-key checks, preference hashes); Wi-Fi ->
#     mobile default-network transition with transport-level assertions
#     (dumpsys connectivity: active default network ID change + WIFI -> MOBILE
#     transport); Data Saver enable/disable with real state readback
#     (cmd netpolicy get restrict-background + dumpsys netpolicy); real
#     process death + cold-start restart with pulled-database integrity
#     checks; startup cost measurements; logcat evidence on failure.
#   - NOT covered here (notebook/manual follow-up): consent revocation
#     mid-stream (in-app UI flow), low-disk conditions, screenshot visual
#     inspection, and real bundle-transfer network/disk costs (require a
#     reachable provider host). Record those results in
#     docs/ai/VERIFICATION.md before claiming 5.11.
on:
  workflow_dispatch:
    inputs:
      verification_scope:
        description: 'all: full suite+upgrade; acceptance: identical-source upgrade; simplifier: focused follow-up to retained full run'
        type: choice
        default: all
        options:
          - all
          - acceptance
          - simplifier
permissions:
  contents: read
concurrency:
  group: stage5-emulator-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stage5-instrumentation:
    if: inputs.verification_scope != 'acceptance'
    name: "5.10 instrumentation — Android 17 / API 37.0 emulator"
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CI_VERIFICATION_SCOPE: ${{ inputs.verification_scope }}
      CI_EXPECTED_API_LEVEL: '37'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Record verified source commit
        run: |
          mkdir -p stage5-ci-results
          CHECKED_OUT="$(git rev-parse HEAD)"
          {
            echo "github.sha: $GITHUB_SHA"
            echo "github.ref: $GITHUB_REF"
            echo "checkout HEAD: $CHECKED_OUT"
          } | tee stage5-ci-results/source-commit.txt
          if [ "$CHECKED_OUT" != "$GITHUB_SHA" ]; then
            echo "ERROR: checked-out commit does not match the dispatched commit"; exit 1
          fi
          df -h / | tee stage5-ci-results/disk-usage.txt
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up required Android SDK packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-36 platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Ensure cmdline-tools >= 23 before AVD creation (API 37 target fix)
        run: |
          # Root cause of the API 37 crash-loop failures (run 43246507990 job
          # 5.10; reproduced locally): cmdline-tools < 22 cannot parse the dotted
          # API level "37.0" - avdmanager exits 0 but writes target=android-0
          # into the AVD .ini, gfxstream is misconfigured and the guest
          # surfaceflinger aborts in mapper.ranchu.so
          # (Assertion failed: !rcEnc->featureInfo()->hasReadColorBufferDma),
          # crash-looping graphics/system_server while sys.boot_completed stays
          # 1, so package installs and tests abort with missing services. The
          # pinned android-emulator-runner v2.38.0 resolves avdmanager from
          # $ANDROID_HOME/cmdline-tools/latest/bin and only installs
          # cmdline-tools when that directory is missing, so the ubuntu-24.04
          # image's preinstalled revision 12.0 was used
          # (actions/runner-images#14484). Upstream fix
          # ReactiveCircus/android-emulator-runner#494 bundles revision 23.0
          # but is not released in v2.38.0. Local A/B on this host: revision
          # 12.0 -> target=android-0 + surfaceflinger crash loop; revision 23.0
          # -> target=android-37.0 + 0 surfaceflinger crashes over 30s and all
          # system services published.
          set -euo pipefail
          CT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools"
          CLT_BUILD=16111833 # cmdline-tools 23.0, the revision bundled by #494
          revision_of() { sed -n 's/^Pkg.Revision=//p' "$1/source.properties" 2>/dev/null | head -n1; }
          major_of() { m="${1%%.*}"; case "$m" in ''|*[!0-9]*) echo 0 ;; *) echo "$m" ;; esac; }
          current="$(revision_of "$CT/latest")"
          if [ "$(major_of "$current")" -lt 23 ]; then
            echo "cmdline-tools/latest revision '${current:-missing}' is below 23; replacing with 23.0 (build $CLT_BUILD)."
            curl -fsSLo /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-${CLT_BUILD}_latest.zip"
            rm -rf "$CT/latest" /tmp/cmdline-tools-clt
            mkdir -p /tmp/cmdline-tools-clt
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-clt
            mv /tmp/cmdline-tools-clt/cmdline-tools "$CT/latest"
          fi
          # Fail closed: the avdmanager the action uses
          # (cmdline-tools/latest/bin) and the one resolving on PATH now must
          # both be revision >= 23, or AVD creation would silently write
          # target=android-0 again.
          seen=""
          for candidate in "$CT/latest/bin/avdmanager" "$(command -v avdmanager || true)"; do
            [ -n "$candidate" ] || continue
            case " $seen " in *" $candidate "*) continue ;; esac
            seen="$seen $candidate"
            rev="$(revision_of "$(dirname "$candidate")/..")"
            echo "avdmanager: $candidate -> cmdline-tools revision ${rev:-unknown}"
            if [ "$(major_of "$rev")" -lt 23 ]; then
              echo "ERROR: avdmanager revision ${rev:-unknown} cannot parse API level 37.0 (writes target=android-0; surfaceflinger crash loop)."
              exit 1
            fi
          done
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and instrumentation APKs (full mode also runs JVM tests)
        run: |
          if [ "$CI_VERIFICATION_SCOPE" = simplifier ]; then
            ./gradlew --no-daemon --max-workers=1 assembleDebug assembleDebugAndroidTest
          else
            ./gradlew --no-daemon --max-workers=1 assembleDebug testDebugUnitTest assembleDebugAndroidTest
          fi
      - name: Run full instrumentation suite on the emulator (attempt 1)
        id: instrumentation-attempt1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '37.0'
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          avd-name: stage5-ci
          disable-animations: true
          # API37 swiftshader_indirect has repeatedly crashed graphics/system_server
          # on hosted runners. swangle is the previously accepted software ANGLE path.
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash scripts/ci_android_instrumentation.sh
      - name: Decide whether an infrastructure retry is required
        id: instrumentation-retry
        if: steps.instrumentation-attempt1.outcome == 'failure'
        run: |
          mkdir -p stage5-ci-results
          # Zero test evidence = no XML OR only XML reporting zero tests (a
          # pre-script abort still writes a well-formed tests="0" XML that
          # Gradle then refuses to load - observed locally on API 37).
          # Any XML with tests > 0 is real evidence and is never retried.
          if python3 - <<'PYEOF' > stage5-ci-results/attempt1-evidence.txt
          import glob
          import sys
          import xml.etree.ElementTree as ET
          xmls = sorted(glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True))
          ran = 0
          for path in xmls:
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:  # malformed XML carries no test counts
                  print(f'unparseable {path}: {exc}')
                  continue
              count = int(root.get('tests', 0) or 0)
              if root.tag == 'testsuites':
                  count = max(count, sum(int(ts.get('tests', 0) or 0) for ts in root.findall('testsuite')))
              print(f'{path}: tests={count}')
              ran += count
          print(f'total tests across result XML: {ran}')
          sys.exit(0 if ran > 0 else 1)
          PYEOF
          then
            echo "Result XML reports executed tests; the failure produced evidence and is not a zero-test infrastructure abort - no retry."
            echo "retry=false" >> "$GITHUB_OUTPUT"
          else
            echo "Zero tests executed (no result XML, or only tests=0 XML); preserving attempt 1 evidence, then retrying once."
            mkdir -p stage5-ci-results/attempt1
            find stage5-ci-results -maxdepth 1 -type f -exec mv -t stage5-ci-results/attempt1/ {} + 2>/dev/null || true
            if [ -f stage5-ci-results/attempt1/source-commit.txt ]; then
              cp stage5-ci-results/attempt1/source-commit.txt stage5-ci-results/
            fi
            echo "retry=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run full instrumentation suite on the emulator (attempt 2)
        id: instrumentation-attempt2
        if: steps.instrumentation-retry.outputs.retry == 'true'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '37.0'
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          avd-name: stage5-ci
          disable-animations: true
          # API37 swiftshader_indirect has repeatedly crashed graphics/system_server
          # on hosted runners. swangle is the previously accepted software ANGLE path.
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash scripts/ci_android_instrumentation.sh
      - name: Summarize and enforce instrumentation results
        if: always()
        id: instrumentation-summary
        env:
          FINAL_OUTCOME: ${{ steps.instrumentation-attempt2.outcome == 'skipped' && steps.instrumentation-attempt1.outcome || steps.instrumentation-attempt2.outcome }}
        run: |
          RC=0
          python3 - > stage5-ci-results/instrumentation-counts.txt <<'PYEOF' || RC=$?
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET
          final_outcome = os.environ.get('FINAL_OUTCOME', '')
          xmls = sorted(glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True))
          if not xmls:
              print(f'No instrumentation result XML files found (zero tests executed; final attempt outcome: {final_outcome}).')
              sys.exit(1)
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in xmls:
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, 0) or 0)
          print(f'Result files: {len(xmls)}')
          print('Tests: {tests}  Failures: {failures}  Errors: {errors}  Skipped: {skipped}'.format(**totals))
          if final_outcome != 'success':
              print(f'FAIL: final emulator attempt outcome is {final_outcome!r}.')
              sys.exit(1)
          if totals['tests'] == 0 or totals['failures'] or totals['errors']:
              print('FAIL: instrumentation did not complete with a clean result set.')
              sys.exit(1)
          print('PASS: instrumentation executed with zero failures/errors.')
          PYEOF
          cat stage5-ci-results/instrumentation-counts.txt
          cat stage5-ci-results/instrumentation-counts.txt >> "$GITHUB_STEP_SUMMARY" || true
          exit "$RC"
      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage5-instrumentation-results
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/**
            stage5-ci-results/**
          if-no-files-found: warn
          retention-days: 30

  stage5-acceptance:
    if: inputs.verification_scope != 'simplifier'
    name: "5.11 acceptance subset — API 36 emulator"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Record verified source commit
        run: |
          mkdir -p stage5-ci-results
          CHECKED_OUT="$(git rev-parse HEAD)"
          {
            echo "github.sha: $GITHUB_SHA"
            echo "github.ref: $GITHUB_REF"
            echo "checkout HEAD: $CHECKED_OUT"
          } | tee stage5-ci-results/source-commit.txt
          if [ "$CHECKED_OUT" != "$GITHUB_SHA" ]; then
            echo "ERROR: checked-out commit does not match the dispatched commit"; exit 1
          fi
          df -h / | tee stage5-ci-results/disk-usage.txt
      - name: Verify connectivity assertion parser and upgrade table expectations
        run: |
          python3 scripts/test_emulator_network_assertion.py
          python3 scripts/test_upgrade_table_expectations.py
      - name: Verify retained native source for acceptance-only execution
        if: inputs.verification_scope == 'acceptance'
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          record=json.loads(Path('docs/planning/goldberg-0.11/stage-6/results/runtime-continuation-2026-10-25/android-source-artifact.json').read_text())
          actual=set(subprocess.check_output(['git','ls-files','app/src','app/build.gradle.kts','app/schemas','contracts/admin/v1/decision-proposal/dto.schema.json'],text=True).splitlines())
          assert actual==set(record['files']), 'Native source inventory changed;run full instrumentation'
          for name,digest in record['files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest, 'Native source changed:'+name
          print('Android source matches retained full native run at',record['sourceCommit'])
          PY
      - name: Check out trusted v0.10.1 tag for the baseline rebuild
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: v0.10.1
          path: baseline-src
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up required Android SDK packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Ensure cmdline-tools >= 23 before AVD creation (API 37 target fix)
        run: |
          # Same cmdline-tools guarantee as job 5.10: the pinned
          # android-emulator-runner v2.38.0 creates the acceptance AVD with
          # cmdline-tools/latest/bin/avdmanager, and revision < 22 silently
          # writes target=android-0 for the dotted API level "37.0"
          # (surfaceflinger crash loop while sys.boot_completed stays 1).
          # Upstream fix: ReactiveCircus/android-emulator-runner#494
          # (revision 23.0), not released in v2.38.0.
          set -euo pipefail
          CT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools"
          CLT_BUILD=16111833 # cmdline-tools 23.0, the revision bundled by #494
          revision_of() { sed -n 's/^Pkg.Revision=//p' "$1/source.properties" 2>/dev/null | head -n1; }
          major_of() { m="${1%%.*}"; case "$m" in ''|*[!0-9]*) echo 0 ;; *) echo "$m" ;; esac; }
          current="$(revision_of "$CT/latest")"
          if [ "$(major_of "$current")" -lt 23 ]; then
            echo "cmdline-tools/latest revision '${current:-missing}' is below 23; replacing with 23.0 (build $CLT_BUILD)."
            curl -fsSLo /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-${CLT_BUILD}_latest.zip"
            rm -rf "$CT/latest" /tmp/cmdline-tools-clt
            mkdir -p /tmp/cmdline-tools-clt
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-clt
            mv /tmp/cmdline-tools-clt/cmdline-tools "$CT/latest"
          fi
          seen=""
          for candidate in "$CT/latest/bin/avdmanager" "$(command -v avdmanager || true)"; do
            [ -n "$candidate" ] || continue
            case " $seen " in *" $candidate "*) continue ;; esac
            seen="$seen $candidate"
            rev="$(revision_of "$(dirname "$candidate")/..")"
            echo "avdmanager: $candidate -> cmdline-tools revision ${rev:-unknown}"
            if [ "$(major_of "$rev")" -lt 23 ]; then
              echo "ERROR: avdmanager revision ${rev:-unknown} cannot parse API level 37.0 (writes target=android-0; surfaceflinger crash loop)."
              exit 1
            fi
          done
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build candidate APK
        run: ./gradlew --no-daemon --max-workers=1 assembleDebug
      - name: Build debug-signed v0.10.1 baseline (same runner debug keystore as candidate)
        run: (cd baseline-src && ./gradlew --no-daemon --max-workers=1 assembleDebug)
      - name: Fetch trusted 0.10.1 release APK (digest + signing-certificate verified)
        run: |
          mkdir -p .gradle/release-artifacts
          curl -fsSL -o .gradle/release-artifacts/Goldberg-v0.10.1.apk \
            https://github.com/${GITHUB_REPOSITORY}/releases/download/v0.10.1/Goldberg-v0.10.1.apk
          echo "854bbfebf617ec920df60d181a12e0dcbd2fed10052f2479903a78a290cef312  .gradle/release-artifacts/Goldberg-v0.10.1.apk" | sha256sum -c -
      - name: Verify signing-certificate compatibility (never using production credentials)
        run: |
          set -euo pipefail
          # Run 39503450845: all three digests came back MISSING because the
          # previous digest_of discarded apksigner's streams/exit codes
          # (2>/dev/null). Now every raw stdout/stderr/exit code is captured to
          # stage5-ci-results/ (uploaded as evidence) and echoed to the step log.
          # The certificate-identity assertions below are UNCHANGED and strict.
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          {
            echo "== signing verification environment =="
            echo "apksigner used: $APKSIGNER"
            echo "build-tools directory:"
            ls -la "$ANDROID_HOME/build-tools" || true
            echo "java: $(command -v java || true)"
            java -version 2>&1 | head -n1 || true
          } | tee stage5-ci-results/signing-environment.txt
          : > stage5-ci-results/apksigner-exit-codes.txt
          digest_of() {
            local apk="$1" name="$2" rc digest
            set +e
            "$APKSIGNER" verify --print-certs "$apk" > "stage5-ci-results/apksigner-$name.log" 2> "stage5-ci-results/apksigner-$name.err"
            rc=$?
            set -e
            echo "$name apksigner exit=$rc" >> stage5-ci-results/apksigner-exit-codes.txt
            {
              echo "== apksigner verify --print-certs [$name] exit=$rc"
              echo "--- stdout (stage5-ci-results/apksigner-$name.log):"
              cat "stage5-ci-results/apksigner-$name.log"
              echo "--- stderr (stage5-ci-results/apksigner-$name.err):"
              cat "stage5-ci-results/apksigner-$name.err"
            } >&2
            # Root cause of run 39503450845 MISSING digests: apksigner's print
            # format changed in build-tools 37.0.0 (preinstalled on the runner,
            # selected by sort -V | tail -n1) from 'Signer #1 certificate SHA-256
            # digest:' to 'V2 Signer: certificate SHA-256 digest:' (verified
            # locally: both versions report the same digest, only labels differ).
            # Parse both formats and require exactly one distinct signer digest.
            digest="$(sed -n 's/^.*certificate SHA-256 digest: //p' "stage5-ci-results/apksigner-$name.log" | sort -u)"
            if [ "$(printf '%s\n' "$digest" | grep -c '^.' || true)" -gt 1 ]; then
              echo "ERROR [$name]: multiple distinct signer certificate digests found:" >&2
              printf '%s\n' "$digest" >&2
              digest=""
            fi
            if [ -z "$digest" ]; then
              digest="$(sed -n 's/^.*certificate SHA-256 digest: //p' "stage5-ci-results/apksigner-$name.err" | sort -u)"
              [ -z "$digest" ] || echo "NOTE [$name]: certificate digest was found on stderr, not stdout" >&2
            fi
            printf '%s' "$digest"
          }
          TRUSTED="53eface4978f03dd7f0d7f1eb97ab94eed97055fe04a2a0fab9a7f280141d59e"
          RELEASE="$(digest_of .gradle/release-artifacts/Goldberg-v0.10.1.apk release)"
          BASELINE="$(digest_of baseline-src/app/build/outputs/apk/debug/app-debug.apk baseline)"
          CANDIDATE="$(digest_of app/build/outputs/apk/debug/app-debug.apk candidate)"
          {
            echo "trusted release certificate SHA-256: $TRUSTED"
            echo "downloaded 0.10.1 release certificate SHA-256: ${RELEASE:-MISSING}"
            echo "v0.10.1 debug-rebuild certificate SHA-256: ${BASELINE:-MISSING}"
            echo "candidate certificate SHA-256: ${CANDIDATE:-MISSING}"
            echo "apksigner exit codes:"
            cat stage5-ci-results/apksigner-exit-codes.txt
          } | tee stage5-ci-results/signing-evidence.txt
          FAIL=""
          if grep -qv "exit=0" stage5-ci-results/apksigner-exit-codes.txt; then
            FAIL="$FAIL ERROR: apksigner exited non-zero for at least one APK (see apksigner-exit-codes.txt and apksigner-*.log/.err)."
          fi
          if [ -z "$RELEASE" ]; then
            FAIL="$FAIL ERROR: no certificate digest could be parsed from the release APK apksigner output (raw streams preserved in stage5-ci-results/apksigner-release.*)."
          elif [ "$RELEASE" != "$TRUSTED" ]; then
            FAIL="$FAIL ERROR: downloaded 0.10.1 release APK carries certificate $RELEASE, not the trusted $TRUSTED."
          fi
          if [ -z "$BASELINE" ] || [ -z "$CANDIDATE" ]; then
            FAIL="$FAIL ERROR: no certificate digest parsed for the in-place upgrade pair (raw streams preserved in stage5-ci-results/apksigner-baseline.* / apksigner-candidate.*)."
          elif [ "$BASELINE" != "$CANDIDATE" ]; then
            FAIL="$FAIL ERROR: in-place upgrade baseline ($BASELINE) and candidate ($CANDIDATE) are not signed with the same runner key."
          fi
          if [ -n "$FAIL" ]; then echo "$FAIL"; exit 1; fi
          echo "OK: release identity trusted; in-place upgrade pair signature-compatible"
      - name: Run acceptance checks on the emulator (attempt 1)
        id: acceptance-attempt1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: stage5-ci
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash scripts/ci_stage6_acceptance.sh
      - name: Decide whether an infrastructure retry is required
        id: acceptance-retry
        if: steps.acceptance-attempt1.outcome == 'failure'
        run: |
          mkdir -p stage5-ci-results
          if [ -f stage5-ci-results/services-ready.txt ]; then
            echo "The acceptance script reached system-service readiness; its failure is not a boot/service race - no retry."
            echo "retry=false" >> "$GITHUB_OUTPUT"
          else
            echo "The acceptance script never reached system-service readiness (boot race or service wedge); preserving attempt 1 evidence, then retrying once."
            mkdir -p stage5-ci-results/attempt1
            find stage5-ci-results -maxdepth 1 -type f -exec mv -t stage5-ci-results/attempt1/ {} + 2>/dev/null || true
            if [ -f stage5-ci-results/attempt1/source-commit.txt ]; then
              cp stage5-ci-results/attempt1/source-commit.txt stage5-ci-results/
            fi
            echo "retry=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run acceptance checks on the emulator (attempt 2)
        id: acceptance-attempt2
        if: steps.acceptance-retry.outputs.retry == 'true'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: stage5-ci
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash scripts/ci_stage6_acceptance.sh
      - name: Enforce acceptance outcome
        if: always()
        id: acceptance-summary
        env:
          FINAL_OUTCOME: ${{ steps.acceptance-attempt2.outcome == 'skipped' && steps.acceptance-attempt1.outcome || steps.acceptance-attempt2.outcome }}
        run: |
          RC=0
          if [ "$FINAL_OUTCOME" != "success" ]; then
            echo "FAIL: final acceptance attempt outcome is '$FINAL_OUTCOME'."
            RC=1
          fi
          if [ ! -f stage5-ci-results/upgrade/result.json ]; then
            echo "FAIL: upgrade verification result.json is missing (acceptance did not complete)."
            RC=1
          fi
          if [ "$RC" -eq 0 ]; then
            echo "PASS: acceptance attempt completed (upgrade result present)."
            cat stage5-ci-results/upgrade/result.json
          fi
          exit "$RC"
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage5-acceptance-results
          path: |
            stage5-ci-results/**
          if-no-files-found: warn
          retention-days: 30
# This workflow never publishes APKs and never uses production signing
# credentials: debug APKs are signed only with the runner's temporary debug
# keystore. CI-built APKs are verification artifacts, not releases.
# Stage 5 remains IN PROGRESS until all mandatory checks pass with executed
# evidence recorded in docs/ai/VERIFICATION.md (AGENTS.md publication gates).
